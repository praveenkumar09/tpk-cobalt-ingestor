<style>

 <div class="eyeline" id="elL" style="left:520px;top:372px;width:76px;transform:rotate(-5deg)"></div><div class="eyeline" id="elR" style="left:692px;top:350px;width:66px;transform:rotate(-8deg)"></div></div>

<script>
const TL=window.TL,B=TL.beats,ENV=TL.env;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const outC=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const bt=id=>B.find(b=>b.id===id);
const env=t=>{const i=t*TL.envFps;const a=ENV[Math.floor(i)]||0,b=ENV[Math.floor(i)+1]||0;return lerp(a,b,i%1)};
const ICON={chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',up:'<path d="M3 17l5-5 4 3 8-9"/><path d="M15 6h5v5"/>',map:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 .8M7 8l4 8M17 10l-4 6"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',rocket:'<path d="M12 3c4 2 6 6 5 11l-3 3h-4l-3-3c-1-5 1-9 5-11z"/><circle cx="12" cy="10" r="1.8"/><path d="M8 17l-3 4M16 17l3 4"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',src:'<path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/><path d="M13.5 5l-3 14"/>'};
// backgrounds derived from beats
const BGD=[['light','b01'],['dark','b02'],['light','b03'],['hot','b04'],['light','b05'],['soft','b06'],['light','b07'],['dark','b09'],['hot','b11']];
const BGS=BGD.map((x,i)=>[x[0],i==0?0:bt(x[1]).t0-.1,i==BGD.length-1?999:bt(BGD[i+1][1]).t0-.1]);
BGS.forEach((b,i)=>{const d=document.createElement('div');d.className='bg '+b[0];d.id='bg'+i;$('bgs').appendChild(d)});
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='bokeh';const s=120+((i*97)%220);d.style.cssText=`width:${s}px;height:${s}px;left:${(i*233)%1800}px;top:${(i*151)%900}px;opacity:.55`;d.dataset.p=i;$('bok').appendChild(d)}
function mk(id,html,dark){const d=document.createElement('div');d.className='stage'+(dark?' onD':'');d.id=id;d.style.opacity=0;d.innerHTML=html;$('stages').appendChild(d);return d}
const stages={};
const person=hi=>`<svg class="person ${hi?'hi':''}" viewBox="0 0 62 70"><circle cx="31" cy="20" r="14"/><path d="M5 68c2-18 12-26 26-26s24 8 26 26z"/></svg>`;
// b02
stages.s2=mk('s2',`<div class="kick" style="color:#FFB3C6">THE RULES THAT RUN OUR BUSINESS</div>
<div id="win" class="abs glass" style="left:0;top:80px;width:690px;height:470px;padding:34px 36px;opacity:0"><div style="display:flex;gap:10px;margin-bottom:18px"><i style="width:16px;height:16px;border-radius:50%;background:#FF8FA9"></i><i style="width:16px;height:16px;border-radius:50%;background:#FFD6DF"></i><i style="width:16px;height:16px;border-radius:50%;background:#fff"></i><span style="margin-left:14px;font-size:20px;color:#FFC9D6;font-weight:600">CLAIMS-DECISION.cbl</span></div><div class="code" id="codeT"></div></div>
<div id="lockB" class="abs" style="left:600px;top:20px;width:130px;height:130px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0;box-shadow:0 20px 40px -14px rgba(0,0,0,.5)"><svg viewBox="0 0 24 24" style="width:70px;height:70px;stroke:#D31145;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICON.lock}</svg></div>
<div id="ppl" class="abs" style="left:760px;top:90px;width:420px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px 10px;opacity:0">${[...Array(25)].map((_,i)=>person([2,7,13].includes(i))).join('')}</div>

// b03
stages.s3=mk('s3',`<div class="kick" style="color:var(--red)">ONE COMPLICATED QUESTION</div>
<div class="abs" style="left:0;top:40px;display:flex;align-items:baseline;gap:24px"><div id="d715" style="font-size:230px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--red)">7–15</div><div style="font-size:84px;font-weight:700">days</div></div>
<div class="abs" style="left:0;top:330px;font-size:40px;color:#3A3A3F;font-weight:600">to answer it by hand, checking code and logic</div>
<div class="abs" style="left:0;top:410px;display:grid;grid-template-columns:repeat(5,196px);gap:14px">${[...Array(15)].map((_,i)=>`<div class="cell" id="cell${i}">Day ${i+1}</div>`).join('')}</div>

stages.s4=mk('s4',`<div class="kick" style="color:#FFC9D6">PUT A REAL SCENARIO TO ORBIT</div>
<div id="q" class="abs" style="left:0;top:70px;width:1080px;border-radius:34px 34px 34px 8px;background:#fff;color:var(--ink);padding:28px 36px;font-size:44px;font-weight:600;line-height:1.25;opacity:0;box-shadow:0 26px 50px -24px rgba(0,0,0,.5)"><span id="qt"></span><span id="qc" style="color:var(--red)">|</span></div>
${['Surrender request','Eligibility rule','Surrender value','Loan offset','Payout'].map((n,i)=>`<div class="node" id="nd${i}" style="left:${(i%3)*430}px;top:${300+Math.floor(i/3)*150}px"><i id="ndi${i}"></i><b>${n}</b></div>`).join('')}
<div id="mins" class="abs" style="left:0;top:640px;display:flex;align-items:center;gap:26px;opacity:0"><svg viewBox="0 0 24 24" style="width:110px;height:110px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 3h5M12 3v2"/></svg><div style="font-size:120px;font-weight:700;letter-spacing:-.03em;line-height:1">minutes</div></div>`,true);
// b05
stages.s5=mk('s5',`<div class="kick" style="color:var(--red)">THE ANSWER, IN BUSINESS LANGUAGE</div>
<div class="abs" id="tg" style="left:0;top:50px;display:flex;border-radius:99px;background:#fff;border:1.5px solid var(--line);padding:6px;opacity:0"><div id="tgB" style="padding:12px 34px;border-radius:99px;background:var(--red);color:#fff;font-size:30px;font-weight:700">Business</div><div id="tgT" style="padding:12px 34px;border-radius:99px;color:#6E6E73;font-size:30px;font-weight:700">Technical</div></div>
<div id="ans" class="abs card" style="left:0;top:150px;width:1160px;padding:34px 40px;opacity:0"><div style="font-size:34px;line-height:1.4;color:#2A2A2E">A surrender in <b>year three</b> pays out the <b style="color:var(--red)">surrender value</b>, less any <b style="color:var(--red)">outstanding policy loan</b>. A lapsed policy is <b style="color:var(--red)">rejected</b> before any payout.</div>
<div style="margin-top:22px;display:flex;gap:12px"><span style="font-size:23px;font-weight:700;color:var(--red);background:var(--blush);border-radius:99px;padding:8px 20px">Source cited · program section</span><span style="font-size:23px;font-weight:700;color:var(--red);background:var(--blush);border-radius:99px;padding:8px 20px">Rules</span><span style="font-size:23px;font-weight:700;color:var(--red);background:var(--blush);border-radius:99px;padding:8px 20px">Flow</span></div></div>
<div id="dt" class="abs card" style="left:0;top:470px;width:1160px;overflow:hidden;opacity:0"><div style="display:grid;grid-template-columns:1fr 1fr;background:var(--red);color:#fff;font-size:26px;font-weight:700;padding:14px 30px"><div>Condition</div><div>Outcome</div></div>
${[['Policy in force, year 3 or later','Surrender value paid'],['Policy loan outstanding','Deducted from payout'],['Policy lapsed','Rejected before payout']].map((r,i)=>`<div class="dtr" id="dtr${i}" style="display:grid;grid-template-columns:1fr 1fr;padding:18px 30px;font-size:30px;font-weight:600;border-top:1.5px solid var(--line);opacity:0"><div>${r[0]}</div><div style="color:var(--red)">${r[1]}</div></div>`).join('')}</div>
<div class="abs" id="ex" style="left:0;top:790px;font-size:21px;color:#6E6E73;font-style:italic;opacity:0">Illustrative example</div>`);
// b06
const gl=(id,t,x,y,inner)=>`<div class="abs card" id="${id}" style="left:${x}px;top:${y}px;width:570px;height:330px;padding:26px 30px;opacity:0"><div style="font-size:23px;font-weight:700;letter-spacing:.16em;color:var(--red)">${t}</div>${inner}</div>`;
stages.s6=mk('s6',`<div class="kick" style="color:var(--red)">FROM QUESTION TO CHANGE</div>`+
gl('g0','IMPACT MAP',0,60,`<svg viewBox="0 0 300 220" style="width:100%;height:240px"><circle cx="150" cy="115" r="100" fill="none" stroke="#EBD3DA" stroke-width="3"/><circle cx="150" cy="115" r="66" fill="none" stroke="#F3A8BD" stroke-width="3"/><circle cx="150" cy="115" r="32" fill="#D31145"/><circle cx="215" cy="90" r="9" fill="#D31145"/><circle cx="95" cy="150" r="9" fill="#D31145"/><circle cx="240" cy="165" r="8" fill="#F3A8BD"/><circle cx="60" cy="70" r="8" fill="#F3A8BD"/></svg>`)+
gl('g1','REQUIREMENT + TESTS',590,60,`<div style="margin-top:14px;display:grid;gap:12px">${[100,84].map(w=>`<div style="height:18px;width:${w}%;border-radius:10px;background:#E8DADF"></div>`).join('')}<div style="margin-top:8px;display:grid;gap:10px">${['Scenario 1','Scenario 2','Scenario 3'].map(x=>`<div style="display:flex;gap:14px;align-items:center;font-size:28px;font-weight:600"><span style="width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px">✓</span>${x}</div>`).join('')}</div></div>`)+
gl('g2','CODING AGENT',0,410,`<div class="code" style="font-size:25px;line-height:1.6;color:#2A2A2E;margin-top:14px"><span style="color:#B3123D">- IF WS-AMT &gt; 0</span>\n<span style="color:#127A55">+ IF WS-AMT &gt; WS-LOAN</span>\n<span style="color:#127A55">+    SUBTRACT WS-LOAN</span>\n  PERFORM 2300-PAYOUT</div>`)+
gl('g3','CHECKED, THEN REVIEWED',590,410,`<div style="margin-top:22px;display:grid;gap:20px"><div style="display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700"><span style="width:56px;height:56px;border-radius:50%;background:#127A55;color:#fff;display:grid;place-items:center;font-size:32px">✓</span>Real compiler passes</div><div style="display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700"><span style="width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center">${'<svg viewBox="0 0 24 24" style="width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>'}</span>A person decides</div></div>`));
// lists
function rows(id,items,head,sub){return mk(id,`<div class="kick" style="color:var(--red)">${head}</div><h1 style="font-size:72px;margin-top:8px">${sub}</h1>`+items.map((x,i)=>`<div class="row" id="${id}r${i}" style="top:${220+i*190}px"><div class="ic"><svg viewBox="0 0 24 24">${ICON[x[0]]}</svg></div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join(''))}

// b09
stages.mas=mk('mas',`<div class="kick" style="color:#FFB3C6">WHY NOW</div>

// captions
const eq=$('eq');for(let i=0;i<7;i++)eq.appendChild(document.createElement('i'));
let lastBeat=-1;
function setCaption(t){
  const i=B.findIndex(b=>t>=b.t0-0.05&&t<=b.t1+0.35);const cap=$('cap');
  if(i<0){cap.style.opacity=0;return}
  const b=B[i];

  for(let j=0;j<ws.length;j++){const on=j<=Math.floor(k);ws[j].style.color=on?(j===Math.floor(k)?'#D31145':'#1D1D1F'):'#9A9AA0'}

}
function frac(id,f){const b=bt(id);return b.t0+(b.t1-b.t0)*f}
function layerOp(t,a,b,fi=.4,fo=.4){return clamp((t-a)/fi)*(1-clamp((t-(b-fo))/fo))}
function pop(el,t,t0,dx=0,dy=30){const k=back(clamp((t-t0)/.55));const o=clamp((t-t0)/.25);el.style.opacity=o;el.style.transform=`translate(${(1-k)*dx}px,${(1-k)*dy}px) scale(${.92+.08*k})`}
const CODE=["<span class=k>IF</span> POLICY-STATUS = 'LAPSED'","   <span class=k>MOVE</span> 'REJECT' <span class=k>TO</span> CLAIM-RESULT","<span class=k>ELSE IF</span> WS-WAIT-DAYS &lt; 30","   <span class=k>PERFORM</span> 2300-CHECK-WAITING","<span class=k>ELSE</span>","   <span class=k>PERFORM</span> 2400-APPROVE-CLAIM","<span class=k>END-IF</span>."];
const QTXT="A customer surrenders in year 3 with a policy loan. What happens?";
function R(t){
  BGS.forEach((b,i)=>{$('bg'+i).style.opacity=clamp((t-(b[1]-.25))/.5)*(i<BGS.length-1?1-clamp((t-(b[2]-.25))/.5):1)});

  const win=[['s2','b02','b02'],['s3','b03','b03'],['s4','b04','b04'],['s5','b05','b05'],['s6','b06','b06'],['bo','b07','b07'],['ai','b08','b08'],['mas','b09','b09'],['hrs','b10','b10']];
  win.forEach(([id,a,b])=>{stages[id==='bo'?'bo':id==='ai'?'ai':id==='mas'?'mas':id==='hrs'?'hrs':id].style.opacity=layerOp(t,bt(a).t0-.2,bt(b).t1+.15,.45,.45)});
  // s2
  {const s=bt('b02');pop($('win'),t,s.t0+.1,-60,0);const n=clamp((t-s.t0-.5)/(s.t1-s.t0-1.5))*CODE.length;$('codeT').innerHTML=CODE.slice(0,Math.ceil(n)).join('\n');
   pop($('lockB'),t,frac('b02',.42),0,-20);pop($('ppl'),t,frac('b02',.55),60,0);pop($('pplT'),t,frac('b02',.72),0,20)}
  // s3
  {const s=bt('b03');const n=clamp((t-s.t0-.3)/(s.t1-s.t0-.6))*15;for(let i=0;i<15;i++){$('cell'+i).className='cell'+(i<Math.floor(n)?' on':'')}}
  // s4
  {const s=bt('b04');pop($('q'),t,s.t0+.1,0,30);const n=Math.floor(clamp((t-s.t0-.5)/2.2)*QTXT.length);$('qt').textContent=QTXT.slice(0,n);$('qc').style.opacity=Math.floor(t*2.5)%2;
   for(let i=0;i<5;i++){const tt=frac('b04',.38+i*.1);pop($('nd'+i),t,tt,-40,0);const on=t>tt+.1;$('ndi'+i).style.background=on?'#fff':'rgba(255,255,255,.25)'}
   pop($('mins'),t,frac('b04',.82),0,30)}
  // s5
  {const s=bt('b05');pop($('tg'),t,s.t0+.1,0,-20);const tech=t>frac('b05',.9);$('tgB').style.cssText=tech?'padding:12px 34px;border-radius:99px;color:#6E6E73;font-size:30px;font-weight:700':'padding:12px 34px;border-radius:99px;background:#D31145;color:#fff;font-size:30px;font-weight:700';
   $('tgT').style.cssText=tech?'padding:12px 34px;border-radius:99px;background:#D31145;color:#fff;font-size:30px;font-weight:700':'padding:12px 34px;border-radius:99px;color:#6E6E73;font-size:30px;font-weight:700';
   pop($('ans'),t,s.t0+.35,0,30);pop($('dt'),t,frac('b05',.5),0,30);for(let i=0;i<3;i++)pop($('dtr'+i),t,frac('b05',.6+i*.1),0,10);$('ex').style.opacity=sm((t-frac('b05',.6))/.4)}
  // s6
  ['g0','g1','g2','g3'].forEach((g,i)=>pop($(g),t,frac('b06',[.1,.3,.5,.75][i]),0,40));

  L('bo',[frac('b07',.12),frac('b07',.42),frac('b07',.72)]);L('ai',[frac('b08',.12),frac('b08',.45),frac('b08',.75)]);
  // mas / hrs
  pop($('masT'),t,bt('b09').t0+.2,0,40);$('masS').style.opacity=sm((t-frac('b09',.45))/.5);
  {const s=bt('b10');pop($('hT'),t,s.t0+.1,0,40);const v=Math.round(200*outC((t-s.t0-.6)/2.2));$('hv').innerHTML='≈'+v+'<span style="font-size:90px"> hrs</span>';$('hn').style.opacity=sm((t-frac('b10',.55))/.5)}

  const mix=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)});
  const p=mix(mix(pos.hero,pos.tile,k1),pos.close,k2);
  const bob=Math.sin(t*1.7)*7,rot=Math.sin(t*1.1)*1.1;
  $('orbit').style.transform=`translate(${p.x}px,${p.y+bob}px) rotate(${rot}deg) scale(${p.s*(1+.022*e)})`;
  $('halo').style.opacity=.35+.65*e;$('halo').style.transform=`scale(${1+e*.1})`;
  $('jtag').style.opacity=1-k2;
  // face
  const talking=B.some(b=>t>=b.t0-.05&&t<=b.t1+.1);const m=talking?Math.pow(e,.7):0;
  const mo=$('mouth');mo.style.opacity=m>.05?1:0;mo.style.width=(66+44*m)+'px';mo.style.height=(8+28*m)+'px';mo.style.left=(642-(33+22*m))+'px';mo.style.top=(452-(4+14*m))+'px';mo.style.borderRadius=(14+10*m)+'px';
  $('must').style.transform=`translateY(${-m*17}px) rotate(${Math.sin(t*9)*m*.8}deg)`;
  $('bulb').style.opacity=.1+.9*e;$('bulb').style.transform=`scale(${1+e*.4})`;
  const ph=(t-1.7)%3.4;const bl=ph<0.18?Math.sin(ph/0.18*Math.PI):0;
  ['ecL','ecR','elL','elR'].forEach(id=>$(id).style.opacity=clamp(bl*1.4));
  setCaption(t);
}
window.R=R;R(0);
