<div id="ex" class="abs" style="left:480px;top:835px;font-size:20px;color:#C9A7B3;font-style:italic;opacity:0">Illustrative example</div>`);
mkL('s6',`<div class="abs kick" style="left:480px;top:56px">FROM QUESTION TO CHANGE</div>
<div id="rl0" class="cap3 big" style="font-size:26px;color:var(--pink)">DIRECTLY AFFECTED</div><div id="rl1" class="cap3 big" style="font-size:26px;color:var(--pink)">ALSO TOUCHES</div><div id="rl2" class="cap3 big" style="font-size:26px;color:var(--pink)">DOWNSTREAM</div>
${['Requirement','Test scenarios','Code change'].map((n,i)=>`<div id="sat${i}" class="pill cap3" style="font-size:34px;background:rgba(211,17,69,.8);border-color:#fff">${n}</div>`).join('')}
<div id="comp" class="cap3 pill" style="font-size:34px;background:#127A55;border-color:#fff">✓ Compiler-checked</div>
<div id="rev" class="cap3 pill" style="font-size:34px;background:#fff;color:#D31145">A person reviews</div>`);
function cards(id,kick,items,icons){return mkL(id,`<div class="abs kick" style="left:480px;top:56px">${kick}</div>`+items.map((x,i)=>`<div id="${id}c${i}" class="abs glass" style="left:${480+i*455}px;top:190px;width:425px;height:540px;padding:40px 36px;opacity:0"><div id="${id}i${i}" style="width:130px;height:130px;border-radius:36px;background:rgba(211,17,69,.5);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4)">${icons[i]}</div><div class="big" style="font-size:46px;line-height:1.1;margin-top:32px;letter-spacing:-.01em">${x[0]}</div><div style="font-size:28px;line-height:1.35;color:#E8CBD5;margin-top:16px">${x[1]}</div></div>`).join(''))}

const lockSvg=`<svg viewBox="0 0 24 24" style="width:76px;height:76px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><rect x="5" y="11" width="14" height="9" rx="2"/><path id="shackle" d="M8 11V8a4 4 0 0 1 8 0v3" style="transform-origin:8px 11px"/></svg>`;

mkL('s9',`<div class="abs kick" style="left:480px;top:56px">WHY NOW</div>
<div id="shield" class="abs" style="left:520px;top:250px;width:420px;height:470px;opacity:0"><svg viewBox="0 0 24 26" style="width:420px;height:470px;fill:rgba(211,17,69,.35);stroke:#fff;stroke-width:.5;stroke-linejoin:round"><path d="M12 1l9 3.2v7.800c0 5.800-3.900 9.700-9 11.200-5.100-1.500-9-5.400-9-11.200V4.200z"/></svg><div class="big" style="position:absolute;left:0;right:0;top:170px;text-align:center;font-size:130px">MAS</div></div>
<div id="m1" class="abs big" style="left:1030px;top:270px;width:800px;font-size:68px;line-height:1.1;opacity:0">proposes tighter <span style="color:var(--pink)">change-management controls</span> for insurers</div>
<div id="m2" class="abs" style="left:1030px;top:560px;width:800px;font-size:32px;line-height:1.4;color:#F2D8E0;opacity:0">Consultation closed 31 July 2026 · 12 months to comply once final.<br><span style="font-size:22px;color:#C9A7B3">A proposal, per law-firm summaries of the MAS consultation.</span></div>`);

// ---------- galaxy data ----------
const R2=rng(7);const NODES=[];const NAMED=['PLCYINQ','CLMPRC','PREMINQ','BNFUPD','POLRNWL'];
for(let i=0;i<52;i++){let x,y,ok,tries=0;do{x=470+R2()*1380;y=110+R2()*620;ok=NODES.every(n=>Math.hypot(n.x-x,n.y-y)>78);tries++}while(!ok&&tries<80);NODES.push({x,y,r:3+R2()*4,ph:R2()*6.28})}
const NAMEDI=[6,15,24,33,43];NAMEDI.forEach((i,k)=>{NODES[i].r=9;NODES[i].name=NAMED[k]});
const EDGES=[];NODES.forEach((n,i)=>{const d=NODES.map((m,j)=>[Math.hypot(m.x-n.x,m.y-n.y),j]).filter(a=>a[1]!==i).sort((a,b)=>a[0]-b[0]).slice(0,2);d.forEach(a=>{if(a[0]<260)EDGES.push([i,a[1]])})});
const BEACONS=[NAMEDI[1],NAMEDI[3],12];
const sn=$('s2n');BEACONS.forEach((bi,i)=>{const d=document.createElement('div');d.id='bcn'+i;d.className='abs';d.style.cssText=`left:${NODES[bi].x-34}px;top:${NODES[bi].y-34}px;width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0`;d.innerHTML=`<svg viewBox="0 0 62 70" style="width:34px;height:38px"><circle cx="31" cy="20" r="14" fill="#D31145"/><path d="M5 68c2-18 12-26 26-26s24 8 26 26z" fill="#D31145"/></svg>`;sn.appendChild(d)});
NODES.forEach((n,i)=>{if(n.name){const d=document.createElement('div');d.className='abs';d.id='nm'+i;d.style.cssText=`left:${n.x+14}px;top:${n.y-14}px;font-family:Menlo,monospace;font-size:20px;color:#FFB3C6;opacity:0;white-space:nowrap`;d.textContent=n.name+'.cbl';sn.appendChild(d)}});
// path for s4
const PATH=[[600,330],[900,470],[1190,310],[1480,470],[1750,330]];
const PL=['Surrender request','Eligibility rule','Surrender value','Loan offset','Payout'];
const segLen=[];let totLen=0;for(let i=1;i<PATH.length;i++){const l=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]);segLen.push(l);totLen+=l}
function pathAt(u){let d=clamp(u)*totLen;for(let i=0;i<segLen.length;i++){if(d<=segLen[i]||i==segLen.length-1){const k=clamp(d/segLen[i]);return[lerp(PATH[i][0],PATH[i+1][0],k),lerp(PATH[i][1],PATH[i+1][1],k)]}d-=segLen[i]}}
PL.forEach((n,i)=>{const e=$('nl'+i);e.textContent=n;e.style.left=PATH[i][0]+'px';e.style.top=(PATH[i][1]+(i%2?-86:40))+'px'});
// ---------- stars ----------
const R3=rng(99);const STARS=[...Array(170)].map(()=>({x:R3()*1920,y:R3()*1080,z:.2+R3()*.8,ph:R3()*6.28}));
function drawBG(t){
  const g=ctx.createRadialGradient(1100,520,50,1100,520,1300);g.addColorStop(0,'#3a0618');g.addColorStop(.55,'#16030b');g.addColorStop(1,'#080106');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);
  const g2=ctx.createRadialGradient(200,1000,10,200,1000,700);g2.addColorStop(0,'rgba(211,17,69,.45)');g2.addColorStop(1,'rgba(211,17,69,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,1920,1080);
  // warp boost near scene changes
  let boost=0;B.forEach(b=>{boost=Math.max(boost,Math.exp(-Math.pow((t-(b.t0-.15))/.28,2)))});
  STARS.forEach(s=>{const x=((s.x-t*14*s.z)%1920+1920)%1920;const a=(.35+.5*Math.sin(t*1.4+s.ph)**2)*s.z;ctx.fillStyle=`rgba(255,${200+55*s.z|0},${215+40*s.z|0},${a})`;
    if(boost>.05){ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.4*s.z;ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x-boost*60*s.z,s.y);ctx.stroke()}else{ctx.beginPath();ctx.arc(x,s.y,1.2*s.z+.3,0,6.283);ctx.fill()}});
}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(1,c.replace('A',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
function ringAround(cx,cy,rx,ry,rot,prog,spin,alpha){ // elliptical orbit with planet
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.strokeStyle=`rgba(255,80,130,${alpha})`;ctx.lineWidth=7;ctx.shadowColor='#ff3b6b';ctx.shadowBlur=24;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,-Math.PI/2,-Math.PI/2+6.283*clamp(prog));ctx.stroke();ctx.shadowBlur=0;
  const a=spin;const px=Math.cos(a)*rx,py=Math.sin(a)*ry;glow(px,py,60,'rgba(255,60,110,A)',alpha);ctx.fillStyle=`rgba(255,230,238,${alpha})`;ctx.beginPath();ctx.arc(px,py,14,0,6.283);ctx.fill();ctx.restore()}
function audioBars(cx,cy,r,e,t,alpha){const n=84;ctx.save();ctx.translate(cx,cy);for(let i=0;i<n;i++){const a=i/n*6.283;const w=.5+.5*Math.sin(i*.9+t*9)*Math.sin(i*.37-t*5);const l=6+(e*60+4)*(.3+.7*w);ctx.strokeStyle=`rgba(255,${150+80*w|0},${185+50*w|0},${alpha*(.5+.5*Math.min(1,e*1.5+.2))})`;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(Math.cos(a)*(r+10),Math.sin(a)*(r+10));ctx.lineTo(Math.cos(a)*(r+10+l),Math.sin(a)*(r+10+l));ctx.stroke()}ctx.restore()}
function scn(id,t,fn){const s=st(id,t);if(s.a<=0.003)return s;ctx.save();ctx.globalAlpha=s.a;ctx.translate(960,540);ctx.scale(s.sc,s.sc);ctx.translate(-960,-540);fn(s);ctx.restore();return s}
const CODEW=['IF','ELSE'];
