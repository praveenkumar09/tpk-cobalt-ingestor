# Intentionally empty of infra services.
#
# This is the older, regex-based ingestor — cobol-ingestor-api (the
# LLM-driven chunk analyzer) superseded it. This compose file used to define
# its own postgres/pgadmin/neo4j containers, reusing the exact SAME
# container names (cobalt_postgres, cobalt_pgadmin, cobalt_neo4j) that
# cobalt-rag-api/docker-compose.yml uses for its own infra — running this
# stack while cobalt-rag-api's was up would fail on a name conflict, and
# running it instead (with cobalt-rag-api's stack down) risked silently
# diverging into a different volume under the same names.
#
# There is now exactly one Postgres + Neo4j pair for local dev, owned by
# cobalt-rag-api/docker-compose.yml:
#   cd ../cobalt-rag-api && docker compose up -d postgres neo4j
# If you still need to run this older ingestor, point it at those
# containers via the same PG_HOST/PG_PORT/NEO4J_URI env vars
# cobol-ingestor-api uses (defaults of localhost:5432 / bolt://localhost:7687
# already match, since those ports are exposed to the host).

services: {}
